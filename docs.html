<script>
    var currentDocZoom = 1.0;

    function ViewHtmlDocumentIframe(encryptedPath, docTitle, cardElement) {
        var isUserLoggedIn = true;
        if (!isUserLoggedIn) {
            if (typeof TenderdetailsLogin === "function") {
                TenderdetailsLogin(167, 1);
            } else if (typeof RegistrationPopup === "function") {
                RegistrationPopup();
            } else {
                $("#dv_registrationmodal").modal("show");
            }
            return false;
        }

        if (!encryptedPath) {
            swal({
                title: '<span style="font-size:smaller;">To download the tender document,please call us:</span></br><span style="font-size:smaller;">+91-9328913635 / +91-9328913634</span>'
            });
            return false;
        }
        var viewUrl = '/TenderDetail/ViewHtmlDocument?filePath=' + encodeURIComponent(encryptedPath);
        $('#htmlDocIframeTitle').text((docTitle || "HTML Document") + " Preview");
        $('#htmlDocIframeLoader').show();
        $('#htmlDocIframeNewTab').attr('href', viewUrl);
        $('#htmlDocIframe').attr('src', viewUrl);
        currentDocZoom = 1.0;
        $('#inlineDocZoomLevel').text("100%");

        // Active highlight state on clicked pill
        $('.tt-doc-pill-btn').removeClass('active').css('border-color', '#cbd5e1');
        $('.tt-doc-pill-btn .tt-doc-floating-tag').css('border-color', '#cbd5e1');
        $('.tt-doc-pill-btn .preview-status-pill').hide();
        if (cardElement) {
            var pill = $(cardElement).closest('.tt-doc-pill-btn');
            pill.addClass('active').css('border-color', '#f59e0b');
            pill.find('.tt-doc-floating-tag').css('border-color', '#f59e0b');
            pill.find('.preview-status-pill').css('display', 'inline-flex').show();
        }

        $('#htmlDocIframeContainer').slideDown(300, function () {
            $('html, body').animate({
                scrollTop: $('#htmlDocIframeContainer').offset().top - 80
            }, 400);
        });
        return false;
    }

    window.onDocIframeLoaded = function() {
        $('#htmlDocIframeLoader').fadeOut(200);
        applyDocZoom();
    };

    function onDocIframeLoaded() {
        window.onDocIframeLoaded();
    }

    $(document).ready(function() {
        $('#htmlDocIframe').on('load', function() {
            if (typeof window.onDocIframeLoaded === "function") {
                window.onDocIframeLoaded();
            }
        });
    });

    function reloadInlineDocIframe() {
        var currentSrc = $('#htmlDocIframe').attr('src');
        if (currentSrc) {
            $('#htmlDocIframeLoader').show();
            $('#htmlDocIframe').attr('src', currentSrc);
        }
    }

    function zoomInlineDocIframe(delta) {
        currentDocZoom = Math.round((currentDocZoom + delta) * 10) / 10;
        if (currentDocZoom < 0.5) currentDocZoom = 0.5;
        if (currentDocZoom > 2.0) currentDocZoom = 2.0;
        $('#inlineDocZoomLevel').text(Math.round(currentDocZoom * 100) + "%");
        applyDocZoom();
    }

    function resetZoomInlineDocIframe() {
        currentDocZoom = 1.0;
        $('#inlineDocZoomLevel').text("100%");
        applyDocZoom();
    }

    function applyDocZoom() {
        try {
            var iframe = document.getElementById('htmlDocIframe');
            if (iframe && iframe.contentWindow && iframe.contentWindow.document && iframe.contentWindow.document.body) {
                iframe.contentWindow.document.body.style.zoom = currentDocZoom;
            }
        } catch (e) {
            console.log("Zoom error: " + e);
        }
    }

    function printInlineDocIframe() {
        try {
            var iframe = document.getElementById('htmlDocIframe');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.focus();
                iframe.contentWindow.print();
            }
        } catch (e) {
            window.open($('#htmlDocIframe').attr('src'), '_blank');
        }
    }

    function toggleInlineDocFullscreen() {
        var container = document.getElementById('htmlDocIframeContainer');
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen();
            } else if (container.mozRequestFullScreen) {
                container.mozRequestFullScreen();
            } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
            } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
            }
            $('#btnInlineDocFullscreen i').removeClass('fa-expand').addClass('fa-compress');
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
            $('#btnInlineDocFullscreen i').removeClass('fa-compress').addClass('fa-expand');
        }
    }

    function closeHtmlDocIframe() {
        $('#htmlDocIframeContainer').slideUp(200);
        $('#htmlDocIframe').attr('src', '');
    }

    function ChatWithUs(DocumentPath, FileName, FolderPath) {
        $.ajax({
            method: "Get",
            url: '/TenderDetail/ConvertPdfToText',
            data: { documentPath: DocumentPath, fileName: FileName, PDFfolderPath: FolderPath},
            success: function (data) {
                if (data.successCode == 1)
                {
                    window.location = '/TenderDetail/ChatWithAI';
                }
            }
        });
    }
</script>
